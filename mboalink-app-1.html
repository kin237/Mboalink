const SUPABASE_URL = 'https://xbyqyfizmkyunyevanmp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Gb35VKUKVhXr2UHftcf1fA_koxPyrHx';
const SESSION_KEY = 'mboalink-session';

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setSession(session) {
  if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}

async function refreshSession(refresh_token) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token }),
  });
  if (!res.ok) return null;
  return res.json();
}

async function getValidAccessToken() {
  let session = getSession();
  if (!session) return null;
  const expiresAt = session.expires_at ? session.expires_at * 1000 : 0;
  if (Date.now() > expiresAt - 60000) {
    const refreshed = await refreshSession(session.refresh_token);
    if (!refreshed || !refreshed.access_token) { setSession(null); return null; }
    session = refreshed;
    setSession(session);
  }
  return session.access_token;
}

async function sb(path, options = {}, authToken) {
  const token = authToken !== undefined ? authToken : (await getValidAccessToken()) || SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).message; } catch (e) {}
    throw new Error(`${res.status}${detail ? ' — ' + detail : ''}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sendMagicLink(email) {
  const redirectTo = window.location.href.split('#')[0];
  const res = await fetch(`${SUPABASE_URL}/auth/v1/otp?redirect_to=${encodeURIComponent(redirectTo)}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, create_user: true }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).msg || (await res.json()).message; } catch (e) {}
    throw new Error(detail || `Erreur ${res.status}`);
  }
}

async function getAuthUser(token) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}` },
  });
  if (!res.ok) return null;
  return res.json();
}

function parseHashTokens() {
  if (!window.location.hash) return null;
  const params = new URLSearchParams(window.location.hash.substring(1));
  const access_token = params.get('access_token');
  const refresh_token = params.get('refresh_token');
  const expires_in = params.get('expires_in');
  if (!access_token) return null;
  return {
    access_token,
    refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (parseInt(expires_in, 10) || 3600),
  };
}

function resizeImageToDataUrl(file, maxSize = 420, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
        else if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function PhotoPicker({ photo, onChange }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    try { onChange(await resizeImageToDataUrl(file)); } catch (err) {}
    setBusy(false);
  }

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 20 }}>
      <div onClick={() => inputRef.current && inputRef.current.click()} style={{ width: 80, height: 80, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer', overflow: 'hidden', background: COLORS.forest, border: '1px solid rgba(250,243,231,0.2)' }}>
        {busy ? <Spinner /> : photo ? <img src={photo} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <span style={{ fontSize: 28 }}>👤</span>}
      </div>
      <div>
        <button type="button" onClick={() => inputRef.current && inputRef.current.click()} style={{ background: 'none', border: 'none', fontSize: 14, fontWeight: 600, textDecoration: 'underline', color: COLORS.gold, cursor: 'pointer' }}>

        </button>
        <p style={{ fontSize: 12, opacity: 0.5, marginTop: 4 }}>Facultatif, mais ça inspire plus confiance.</p>
      </div>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: 'none' }} />
    </div>
  );
}

function ChatView({ matchId, myId, other, onBack }) {
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const bottomRef = useRef(null);

  const load = useCallback(async () => {
    try { setMessages(await sb(`messages?select=*&match_id=eq.${matchId}&order=created_at.asc`) || []); } catch (e) {}
    setLoading(false);
  }, [matchId]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => { const iv = setInterval(load, 4000); return () => clearInterval(iv); }, [load]);
  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  async function send() {
    if (!text.trim()) return;
    setSending(true);
    try { await sb('messages', { method: 'POST', body: JSON.stringify({ match_id: matchId, sender_id: myId, text: text.trim() }) }); setText(''); await load(); } catch (e) {}
    setSending(false);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 90px)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 20px', borderBottom: '1px solid rgba(250,243,231,0.12)' }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: COLORS.cream, fontSize: 18, cursor: 'pointer' }}>←</button>
        <div className="display-font" style={{ width: 36, height: 36, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, overflow: 'hidden', background: COLORS.forest, color: COLORS.gold }}>
          {other && other.photo ? <img src={other.photo} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : ((other && other.prenom) || '?').charAt(0).toUpperCase()}
        </div>
        <div style={{ fontWeight: 600, fontSize: 14 }}>{other && other.prenom}</div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {loading && <div style={{ margin: '0 auto' }}><Spinner /></div>}
        {!loading && messages.length === 0 && <p style={{ textAlign: 'center', fontSize: 12, opacity: 0.5, marginTop: 32 }}>Dites bonjour à {other && other.prenom} !</p>}
        {messages.map(m => (
          <div key={m.id} style={{ display: 'flex', justifyContent: m.sender_id === myId ? 'flex-end' : 'flex-start' }}>
            <div style={{ maxWidth: '75%', padding: '8px 14px', borderRadius: 16, fontSize: 14, background: m.sender_id === myId ? COLORS.gold : 'rgba(250,243,231,0.08)', color: m.sender_id === myId ? COLORS.forestDeep : COLORS.cream }}>{m.text}</div>
          </div>
        ))}
        <div ref={bottomRef} />
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '12px 20px', borderTop: '1px solid rgba(250,243,231,0.12)' }}>
        <input style={{ ...inputStyle, flex: 1 }} value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send(); }} placeholder="Écris un message..." />
        <button onClick={send} disabled={sending || !text.trim()} style={{ padding: 12, borderRadius: 8, border: 'none', cursor: 'pointer', opacity: sending || !text.trim() ? 0.4 : 1, background: COLORS.gold, color: COLORS.forestDeep }}>➤</button>
      </div>
    </div>
  );
}

    <button onClick={onClick} style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '4px 16px', position: 'relative', color: active ? COLORS.gold : 'rgba(250,243,231,0.55)' }}>
      <span style={{ fontSize: 18 }}>{icon}</span>
      <span style={{ fontSize: 11, fontWeight: 500 }}>{label}</span>
      {badge > 0 && <span style={{ position: 'absolute', top: -2, right: 6, fontSize: 10, fontWeight: 700, borderRadius: 999, width: 16, height: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', background: COLORS.red, color: COLORS.cream }}>{badge}</span>}
    </button>
  );
}

function MatchToast({ profile, onClose, onChat }) {
  return (
    <div style={{ margin: '0 20px 16px', borderRadius: 12, padding: 16, display: 'flex', alignItems: 'center', gap: 12, background: 'rgba(227,169,23,0.12)', border: '1px solid rgba(227,169,23,0.4)' }}>
      <span style={{ fontSize: 20 }}>❤️</span>
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 600, fontSize: 14 }}>C'est un match avec {profile.prenom} !</div>
        <button onClick={onChat} style={{ background: 'none', border: 'none', fontSize: 12, textDecoration: 'underline', cursor: 'pointer', color: COLORS.gold }}>Dire bonjour</button>
      </div>
      <button onClick={onClose} style={{ background: 'none', border: 'none', color: COLORS.cream, cursor: 'pointer' }}>✕</button>
    </div>
  );
}

function App() {
  const [phase, setPhase] = useState('loading'); // loading | login | onboarding | app | fatal
  const [fatalError, setFatalError] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [loginSending, setLoginSending] = useState(false);
  const [loginError, setLoginError] = useState(null);
  const [profiles, setProfiles] = useState([]);
  const [likes, setLikes] = useState([]);
  const [matches, setMatches] = useState([]);
  const [tab, setTab] = useState('decouvrir');
  const [activeMatch, setActiveMatch] = useState(null);
  const [saving, setSaving] = useState(false);
  const [matchToast, setMatchToast] = useState(null);
  const [formError, setFormError] = useState(null);

  const myId = authUser ? authUser.id : null;

  const refreshAll = useCallback(async () => {
    try {
      const [p, l, m] = await Promise.all([sb('profiles?select=*&order=created_at.asc'), sb('likes?select=*'), sb('matches?select=*')]);
      setProfiles(p || []); setLikes(l || []); setMatches(m || []);
      return { p: p || [] };
    } catch (e) { setFatalError(e.message); return { p: [] }; }
  }, []);

  useEffect(() => {
    (async () => {
      const hashSession = parseHashTokens();
      if (hashSession) {
        setSession(hashSession);
        window.history.replaceState(null, '', window.location.pathname);
      }
      const token = await getValidAccessToken();
      if (!token) { setPhase('login'); return; }
      const user = await getAuthUser(token);
      if (!user) { setSession(null); setPhase('login'); return; }
      setAuthUser(user);
      const { p } = await refreshAll();
      const existing = p.find(pr => pr.id === user.id);
      setPhase(existing ? 'app' : 'onboarding');
    })();
  }, []);

  useEffect(() => {
    if (phase !== 'app') return;
    const iv = setInterval(refreshAll, 6000);
    return () => clearInterval(iv);
  }, [phase, refreshAll]);

  async function handleSendLink(email) {
    setLoginSending(true); setLoginError(null);
    try { await sendMagicLink(email); } catch (e) { setLoginError(e.message); }
    setLoginSending(false);
  }

  async function handleCreateProfile(data) {
    setSaving(true); setFormError(null);
    try {
      const rows = await sb('profiles', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ id: myId, prenom: data.prenom, age: parseInt(data.age, 10), ville: data.ville, bio: data.bio || null, recherche: data.recherche || null, photo: data.photo || null }) });
      setProfiles(prev => [...prev, rows[0]]);
      setPhase('app');
    } catch (e) { setFormError(e.message); }
    setSaving(false);
  }

  async function handleUpdateProfile(data) {
    setSaving(true);
    try {
      const rows = await sb(`profiles?id=eq.${myId}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ prenom: data.prenom, age: parseInt(data.age, 10), ville: data.ville, bio: data.bio || null, recherche: data.recherche || null, photo: data.photo || null }) });
      setProfiles(prev => prev.map(p => p.id === myId ? rows[0] : p));
    } catch (e) {}
    setSaving(false);
  }

  function handleLogout() {
    setSession(null);
    setAuthUser(null);
    setPhase('login');
  }

  async function handleLike(targetId) {
    try { await sb('likes', { method: 'POST', body: JSON.stringify({ from_id: myId, to_id: targetId }) }); } catch (e) {}
    const updatedLikes = await sb('likes?select=*');
    setLikes(updatedLikes || []);
    const reciprocal = (updatedLikes || []).find(l => l.from_id === targetId && l.to_id === myId);
    if (reciprocal) {
      const currentMatches = await sb('matches?select=*');
      const already = (currentMatches || []).find(m => (m.user_a === myId && m.user_b === targetId) || (m.user_a === targetId && m.user_b === myId));
      if (!already) {
        try {
          await sb('matches', { method: 'POST', body: JSON.stringify({ user_a: myId, user_b: targetId }) });
          setMatches(await sb('matches?select=*') || []);
          setMatchToast(profiles.find(p => p.id === targetId) || { prenom: 'Quelqu\'un' });
        } catch (e) {}
      }
    }
  }

  const myProfile = profiles.find(p => p.id === myId);
  const likedIds = new Set(likes.filter(l => l.from_id === myId).map(l => l.to_id));
  const matchedIds = new Set(matches.filter(m => m.user_a === myId || m.user_b === myId).map(m => m.user_a === myId ? m.user_b : m.user_a));
  const discoverList = profiles.filter(p => p.id !== myId && !likedIds.has(p.id) && !matchedIds.has(p.id));
  const myMatches = matches.filter(m => m.user_a === myId || m.user_b === myId).map(m => ({ matchId: m.id, other: profiles.find(p => p.id === (m.user_a === myId ? m.user_b : m.user_a)) })).filter(m => m.other);

  if (phase === 'loading') {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spinner /></div>;
  }

  if (fatalError) {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 32px', textAlign: 'center' }}>
      <div>
        <div style={{ fontSize: 28, marginBottom: 16 }}>⚠️</div>
        <p style={{ fontWeight: 600, marginBottom: 8 }}>Impossible de contacter la base de données</p>
        <p style={{ fontSize: 14, opacity: 0.7 }}>{fatalError}</p>
      </div>
    </div>;
  }

  return (
    <div style={{ minHeight: '100vh' }}>
      <ToghuStrip />
      {phase === 'login' && <Login onSent={handleSendLink} error={loginError} sending={loginSending} />}
      {phase === 'onboarding' && <Onboarding onSubmit={handleCreateProfile} saving={saving} error={formError} email={authUser && authUser.email} />}
      {phase === 'app' && myProfile && (
        <div style={{ maxWidth: 480, margin: '0 auto', paddingBottom: 96, minHeight: '100vh', position: 'relative' }}>
          <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '24px 20px 16px' }}>
            <div className="display-font" style={{ fontSize: 20, fontWeight: 700 }}>MBOA<span style={{ color: COLORS.gold }}>·</span>LINK</div>
            <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.1em', opacity: 0.5 }}>Europe</div>
          </header>

          {matchToast && <MatchToast profile={matchToast} onClose={() => setMatchToast(null)} onChat={() => {
            const m = myMatches.find(mm => mm.other && mm.other.id === matchToast.id);
            setMatchToast(null); setTab('matchs'); if (m) setActiveMatch(m.matchId);
          }} />}

          {tab === 'decouvrir' && <Discover list={discoverList} onLike={handleLike} />}
          {tab === 'matchs' && !activeMatch && <MatchList matches={myMatches} onOpen={setActiveMatch} />}
          {tab === 'matchs' && activeMatch && <ChatView matchId={activeMatch} myId={myId} other={(myMatches.find(m => m.matchId === activeMatch) || {}).other} onBack={() => setActiveMatch(null)} />}
          {tab === 'profil' && <ProfileEditor profile={myProfile} onSave={handleUpdateProfile} saving={saving} onLogout={handleLogout} email={authUser && authUser.email} />}

          <nav style={{ position: 'fixed', bottom: 0, left: '50%', transform: 'translateX(-50%)', width: '100%', maxWidth: 480, display: 'flex', justifyContent: 'space-around', padding: '12px 0', background: COLORS.forestDeep, borderTop: '1px solid rgba(250,243,231,0.14)' }}>
            <NavButton icon="✨" label="Découvrir" active={tab === 'decouvrir'} onClick={() => { setTab('decouvrir'); setActiveMatch(null); }} />
            <NavButton icon="💬" label="Matchs" active={tab === 'matchs'} badge={myMatches.length} onClick={() => setTab('matchs')} />
            <NavButton icon="👤" label="Profil" active={tab === 'profil'} onClick={() => { setTab('profil'); setActiveMatch(null); }} />
          </nav>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
